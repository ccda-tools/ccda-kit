name: publish-apple

on:
  workflow_call:
    inputs:
      release_tag:
        description: Coordinated semantic release tag
        required: true
        type: string
    secrets:
      SWIFT_DISTRIBUTION_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Test And Publish Apple
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Swift tests
        run: swift test --package-path apple

      - name: Build iOS example
        run: |
          xcodebuild \
            -project apple/Examples/iOS/Example.xcodeproj \
            -scheme Example \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Configure distribution authentication
        env:
          GH_TOKEN: ${{ secrets.SWIFT_DISTRIBUTION_TOKEN }}
        run: gh auth setup-git

      - name: Build Apple distribution branch
        id: distribution
        env:
          GH_TOKEN: ${{ secrets.SWIFT_DISTRIBUTION_TOKEN }}
        run: |
          set -euo pipefail

          distribution_files="$(mktemp -d)"
          cp -R test-data "${distribution_files}/TestData"
          cp CHANGELOG.md LICENSE NOTICE.md SECURITY.md "${distribution_files}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=apple --branch apple-subtree

          git remote add swift-distribution https://github.com/ccda-tools/ccda-swift.git
          git fetch swift-distribution --tags

          if git show-ref --verify --quiet refs/remotes/swift-distribution/main; then
            git switch --create apple-publish swift-distribution/main
            git merge --no-edit apple-subtree
          else
            git switch apple-subtree
          fi

          mkdir -p TestData
          rsync -a --delete "${distribution_files}/TestData/" TestData/
          cp \
            "${distribution_files}/CHANGELOG.md" \
            "${distribution_files}/LICENSE" \
            "${distribution_files}/NOTICE.md" \
            "${distribution_files}/SECURITY.md" \
            .
          git add TestData CHANGELOG.md LICENSE NOTICE.md SECURITY.md

          if ! git diff --cached --quiet; then
            git commit -m "Sync shared Apple distribution files"
          fi

          git push swift-distribution HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Tag and release ccda-swift
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ steps.distribution.outputs.sha }}
        with:
          github-token: ${{ secrets.SWIFT_DISTRIBUTION_TOKEN }}
          script: |
            const owner = 'ccda-tools';
            const repo = 'ccda-swift';
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;

            try {
              const existing = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already points to a different ccda-swift commit.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });
            }
