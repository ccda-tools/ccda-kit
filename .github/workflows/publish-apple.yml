name: publish-apple

on:
  workflow_call:
    inputs:
      release_tag:
        description: Coordinated semantic release tag
        required: true
        type: string
    secrets:
      CCDA_PUBLISHER_APP_ID:
        required: true
      CCDA_PUBLISHER_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Test And Publish Apple
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Apple toolchain
        uses: ./.github/actions/setup-apple

      - name: Run Swift tests
        run: swift test --package-path apple

      - name: Build iOS example
        run: |
          xcodebuild \
            -project apple/Examples/iOS/Example.xcodeproj \
            -scheme Example \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create publisher token
        id: publisher-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CCDA_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CCDA_PUBLISHER_PRIVATE_KEY }}
          owner: ccda-tools
          repositories: ccda-swift

      - name: Configure distribution authentication
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: gh auth setup-git

      - name: Build Apple distribution snapshot
        id: distribution
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          distribution_archive="$(mktemp)"
          distribution_repo="$(mktemp -d)/ccda-swift"
          git archive --format=tar --output="${distribution_archive}" HEAD:apple

          git clone https://github.com/ccda-tools/ccda-swift.git "${distribution_repo}"
          git -C "${distribution_repo}" config user.name "ccda-publisher[bot]"
          git -C "${distribution_repo}" config user.email "ccda-publisher[bot]@users.noreply.github.com"

          if git -C "${distribution_repo}" show-ref --verify --quiet refs/heads/main; then
            git -C "${distribution_repo}" rm -r --ignore-unmatch .
          fi

          tar -xf "${distribution_archive}" -C "${distribution_repo}"
          mkdir -p "${distribution_repo}/TestData"
          rsync -a --delete test-data/ "${distribution_repo}/TestData/"
          cp \
            CHANGELOG.md \
            LICENSE \
            NOTICE.md \
            SECURITY.md \
            "${distribution_repo}/"
          git -C "${distribution_repo}" add --all

          if ! git -C "${distribution_repo}" diff --cached --quiet; then
            git -C "${distribution_repo}" commit \
              -m "Release ${RELEASE_TAG}" \
              -m "Source: ccda-tools/ccda-kit@${SOURCE_SHA}"
          fi

          git -C "${distribution_repo}" push origin HEAD:main
          distribution_sha="$(git -C "${distribution_repo}" rev-parse HEAD)"
          echo "sha=${distribution_sha}" >> "${GITHUB_OUTPUT}"

      - name: Tag and release ccda-swift
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ steps.distribution.outputs.sha }}
        with:
          github-token: ${{ steps.publisher-token.outputs.token }}
          script: |
            const owner = 'ccda-tools';
            const repo = 'ccda-swift';
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;

            try {
              const existing = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already points to a different ccda-swift commit.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });
            }
