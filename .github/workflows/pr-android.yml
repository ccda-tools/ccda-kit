name: pr-android

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "android/**"
      - "test-data/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/pr-android.yml"
      - ".github/workflows/publish-android.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-android/**"

jobs:
  android-test:
    name: Android Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test

      - name: Build Android sample
        working-directory: android
        run: ./gradlew :sample-app:assembleDebug
