name: pr-apple

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "apple/**"
      - "test-data/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/pr-apple.yml"
      - ".github/workflows/publish-apple.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-apple/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Apple toolchain
        uses: ./.github/actions/setup-apple

      - name: Run Swift tests
        run: swift test --package-path apple

      - name: Build iOS example
        run: |
          xcodebuild \
            -project apple/Examples/iOS/Example.xcodeproj \
            -scheme Example \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
