name: pr-react-native

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "react-native/**"
      - "apple/**"
      - "android/ccda-engine/**"
      - "test-data/**"
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/pr-react-native.yml"
      - ".github/workflows/publish-react-native.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-native-test:
    name: React Native Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Install example dependencies
        run: npm ci --prefix example

      - name: Test and typecheck example
        working-directory: react-native/example
        run: |
          npm test -- --runInBand
          npx --no-install tsc --noEmit

      - name: Bundle example for both platforms
        working-directory: react-native/example
        run: |
          npx --no-install react-native bundle --platform ios --dev false --entry-file index.js --bundle-output "${RUNNER_TEMP}/example.ios.js" --max-workers 2
          npx --no-install react-native bundle --platform android --dev false --entry-file index.js --bundle-output "${RUNNER_TEMP}/example.android.js" --max-workers 2

  android-build:
    name: React Native Android (${{ matrix.engine_source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine_source: [local, published]
    env:
      CCDA_EXAMPLE_ENGINE_SOURCE: ${{ matrix.engine_source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            react-native/package-lock.json
            react-native/example/package-lock.json
      - uses: ./.github/actions/setup-android
      - name: Install package and example dependencies
        working-directory: react-native
        run: |
          npm ci
          npm run build
          npm ci --prefix example
      - name: Build Android example
        working-directory: react-native/example/android
        run: ./gradlew :app:assembleDebug

  ios-build:
    name: React Native iOS (${{ matrix.engine_source }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        engine_source: [local, published]
    env:
      CCDA_EXAMPLE_ENGINE_SOURCE: ${{ matrix.engine_source }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-apple
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            react-native/package-lock.json
            react-native/example/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: react-native/example
          bundler-cache: true
      - name: Install package and example dependencies
        working-directory: react-native
        run: |
          npm ci
          npm run build
          npm ci --prefix example
      - name: Test library CocoaPods integration
        working-directory: react-native/example
        run: bundle exec ruby ../ios/Tests/ccda_pods_test.rb
      - name: Install pods
        working-directory: react-native/example/ios
        run: bundle exec pod install --no-repo-update
      - name: Build iOS example
        working-directory: react-native/example/ios
        run: xcodebuild -workspace CCDAExample.xcworkspace -scheme CCDAExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
