name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: coordinated-release
  cancel-in-progress: false

jobs:
  version:
    name: Calculate Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Calculate release version
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tags = await github.paginate(
              github.rest.repos.listTags,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const versions = tags
              .map(({ name, commit }) => {
                const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(name);
                return match
                  ? {
                      major: Number(match[1]),
                      minor: Number(match[2]),
                      patch: Number(match[3]),
                      sha: commit.sha
                    }
                  : null;
              })
              .filter(Boolean)
              .sort((lhs, rhs) =>
                rhs.major - lhs.major ||
                rhs.minor - lhs.minor ||
                rhs.patch - lhs.patch
              );

            const latest = versions[0];
            if (latest?.sha === context.sha) {
              const version = `${latest.major}.${latest.minor}.${latest.patch}`;
              core.notice(`Reusing ${version} for this ccda-kit commit.`);
              core.setOutput('version', version);
              core.setOutput('tag', `v${version}`);
              return;
            }

            const next = latest
              ? { major: latest.major, minor: latest.minor, patch: latest.patch }
              : { major: 0, minor: 0, patch: 0 };
            switch ('${{ inputs.bump }}') {
              case 'major':
                next.major += 1;
                next.minor = 0;
                next.patch = 0;
                break;
              case 'minor':
                next.minor += 1;
                next.patch = 0;
                break;
              case 'patch':
                next.patch += 1;
                break;
              default:
                core.setFailed('Unsupported semantic version bump.');
                return;
            }

            const version = `${next.major}.${next.minor}.${next.patch}`;
            core.setOutput('version', version);
            core.setOutput('tag', `v${version}`);

  apple:
    name: Publish Apple
    needs: version
    uses: ./.github/workflows/publish-apple.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
    secrets:
      CCDA_PUBLISHER_APP_ID: ${{ secrets.CCDA_PUBLISHER_APP_ID }}
      CCDA_PUBLISHER_PRIVATE_KEY: ${{ secrets.CCDA_PUBLISHER_PRIVATE_KEY }}

  android:
    name: Publish Android
    needs: version
    uses: ./.github/workflows/publish-android.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}

  toolkit:
    name: Tag And Release Toolkit
    needs:
      - version
      - apple
      - android
    runs-on: ubuntu-latest

    steps:
      - name: Tag and release ccda-kit
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;

            try {
              const existing = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already points to a different ccda-kit commit.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });
            }
