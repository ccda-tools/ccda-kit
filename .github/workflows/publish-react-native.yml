name: publish-react-native

on:
  workflow_call:
    inputs:
      release_tag:
        description: Coordinated semantic release tag
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-react-native-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Test And Publish React Native
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Typecheck package
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Set coordinated package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm version --no-git-tag-version --ignore-scripts "${RELEASE_TAG#v}"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Upload npm package archive
        run: npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Upload React Native package
        uses: actions/upload-artifact@v4
        with:
          name: react-native-package-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/*.tgz
